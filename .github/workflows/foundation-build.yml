name: Foundation build validation

# Gatilhos definitivos (Missão 03.1):
#  - push na main ................ executa o CI
#  - pull_request -> main ........ executa o CI (aberto, atualizado, reaberto)
#  - workflow_dispatch ........... execução manual sob demanda
# A missão anterior havia fixado o gatilho de push em uma branch de sessão do
# Arena (arena/39232774-pocket-pad-repository), desligando o CI na prática.
# Não usamos filtros de paths: qualquer alteração (incluindo a documentação e
# o próprio workflow) deve ser validada, e um filtro estrito poderia excluir
# por acidente arquivos importantes da compilação.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Evita cancelar uma execução que já está em curso quando chega um push mais
# recente ao mesmo branch: uma validação em andamento não deve ser invalidada.
concurrency:
  group: foundation-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-34 build-tools;35.0.0 platform-tools'

      - name: Override machine-specific SDK path only in this runner
        working-directory: client
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record tool versions
        working-directory: client
        run: |
          java -version
          sdkmanager --version
          adb version
          bash ./gradlew --version
          JAVA_LINE="$(java -version 2>&1 | head -n 1)"
          SDK_LINE="$(sdkmanager --version)"
          GRADLE_LINE="$(bash ./gradlew --version | awk '/^Gradle / { print; exit }')"
          printf '::notice title=Android tool versions::%s; sdkmanager %s; %s\n' "$JAVA_LINE" "$SDK_LINE" "$GRADLE_LINE"

      - name: Run unit tests and assemble debug APK
        working-directory: client
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Summarize unit test results
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in glob.glob('client/app/build/test-results/testDebugUnitTest/**/*.xml', recursive=True)]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('::notice title=Android unit tests::' + ', '.join(f'{key}={value}' for key, value in totals.items()) + f', suites={len(suites)}')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mousedroid-debug-apk
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: client/app/build/reports/
          if-no-files-found: ignore

  android-instrumented:
    name: Android instrumented test on API 34
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Override machine-specific SDK path only in this runner
        working-directory: client
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented test on Android 34
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: cd client && bash ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Summarize instrumented test results
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('client/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          suites = [ET.parse(path).getroot() for path in paths]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('::notice title=Android instrumented tests::' + ', '.join(f'{key}={value}' for key, value in totals.items()) + f', suites={len(suites)}')
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: client/app/build/reports/androidTests/
          if-no-files-found: ignore

  server-linux:
    name: Linux C++ server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build pkg-config adb libasio-dev \
            libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libcurl4-openssl-dev libsecret-1-dev libnotify-dev libxtst-dev

      - name: Build and install official wxWidgets 3.3.4
        working-directory: /tmp
        run: |
          curl --fail --location --retry 3 \
            https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.4/wxWidgets-3.3.4.tar.bz2 \
            --output wxWidgets-3.3.4.tar.bz2
          tar -xf wxWidgets-3.3.4.tar.bz2
          cmake -S wxWidgets-3.3.4 -B wx-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxBUILD_SAMPLES=OFF -DwxBUILD_DEMOS=OFF -DwxBUILD_TESTS=OFF
          cmake --build wx-build --parallel 2
          sudo cmake --install wx-build
          sudo ldconfig

      - name: Record tool versions
        run: |
          cmake --version
          c++ --version
          ninja --version
          pkg-config --modversion asio
          wx-config --version
          adb version
          CMAKE_LINE="$(cmake --version | head -n 1)"
          CXX_LINE="$(c++ --version | head -n 1)"
          ASIO_VERSION="$(pkg-config --modversion asio)"
          WX_VERSION="$(wx-config --version)"
          printf '::notice title=Linux tool versions::%s; %s; wxWidgets %s; Asio %s\n' "$CMAKE_LINE" "$CXX_LINE" "$WX_VERSION" "$ASIO_VERSION"

      - name: Configure server
        run: cmake -S server -B build/server-linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile server
        run: cmake --build build/server-linux --parallel 2 --verbose

      - name: Run registered C++ tests
        run: ctest --test-dir build/server-linux --output-on-failure

      - name: Inspect generated executable
        run: |
          file build/server-linux/bin/Mousedroid
          ldd build/server-linux/bin/Mousedroid

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: mousedroid-linux-server
          path: build/server-linux/bin/Mousedroid
          if-no-files-found: error

  server-windows:
    name: Windows C++ server
    runs-on: windows-latest
    defaults:
      run:
        working-directory: D:\a\mousedroid-work
    steps:
      # actions/checkout rejects the repository's default path because its name
      # ends in a dot. Clone this public repository into a Windows-safe path.
      - name: Check out into a Windows-safe path
        shell: pwsh
        working-directory: D:\a
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/${{ github.repository }}.git" D:\a\mousedroid-work

      - name: Record compiler and CMake versions
        shell: pwsh
        run: |
          $cmakeLine = (cmake --version | Select-Object -First 1)
          $vsVersion = (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion)
          $vcpkgLine = (vcpkg version | Select-Object -First 1)
          Write-Output $cmakeLine
          Write-Output "Visual Studio $vsVersion"
          Write-Output $vcpkgLine
          Write-Host "::notice title=Windows tool versions::$cmakeLine; Visual Studio $vsVersion; $vcpkgLine"

      - name: Install declared vcpkg dependencies
        shell: pwsh
        run: vcpkg install asio:x64-windows wxwidgets:x64-windows

      - name: Configure server
        shell: pwsh
        run: |
          cmake -S server -B build/server-windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Compile server
        shell: pwsh
        run: |
          & cmake --build build/server-windows --config Release --parallel 2 --verbose 2>&1 | Tee-Object -FilePath windows-compile.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Select-String -Path windows-compile.log -Pattern 'error C[0-9]+|error LNK[0-9]+|error:|FAILED:' | Select-Object -First 40 | ForEach-Object {
              Write-Host "::error::$($_.Line)"
            }
            exit $buildExit
          }

      - name: Upload Windows compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compile-log
          path: D:/a/mousedroid-work/windows-compile.log
          if-no-files-found: ignore

      - name: Run registered C++ tests
        shell: pwsh
        run: ctest --test-dir build/server-windows -C Release --output-on-failure

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: mousedroid-windows-server
          path: D:/a/mousedroid-work/build/server-windows/bin/Release/Mousedroid.exe
          if-no-files-found: error
